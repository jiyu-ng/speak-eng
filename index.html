<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1220" />
    <title>스픽메이트 — AI 영어 스피킹 연습</title>
    <meta name="description" content="AI 파트너와 영어로 대화하며 스피킹을 연습하는 앱. 상황별 회화 + 실시간 교정." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 홈 화면에 추가할 때 쓰이는 아이콘은 PNG 로 둔다 — apple-touch-icon 은
         PNG 가 확실히 지원되는 형식이고 SVG 는 기기·버전에 따라 안 나올 수 있다.
         180×180 은 아이폰 Retina 기준이며 favicon.svg 를 그대로 렌더한 것이다. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="스픽메이트" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="스픽메이트 — AI 영어 스피킹 연습" />
    <meta property="og:description" content="AI 파트너와 영어로 대화하며 스피킹을 연습하는 앱. 상황별 회화 + 실시간 교정." />
